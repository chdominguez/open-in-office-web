name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: ./scripts/make-dmg.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          Download the DMG below and drag the app to Applications. The app isn't notarized yet, so on first launch go to **System Settings › Privacy & Security › Open Anyway** (macOS 15+), or right-click › Open (macOS 13–14). See the [README](https://github.com/chdominguez/open-in-office-web#install).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Open in Office Web $VERSION" --notes-file notes.md
